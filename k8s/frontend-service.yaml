{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "frontend",
    "namespace": "scanner",
    "annotations": {
      "cloud.google.com/neg": "{\"ingress\":true}",
      "cloud.google.com/backend-config": "{\"default\":\"frontend\"}"
    }
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app": "frontend"
    },
    "ports": [
      {
        "name": "http",
        "port": 8501,
        "targetPort": 8501
      }
    ]
  }
}
