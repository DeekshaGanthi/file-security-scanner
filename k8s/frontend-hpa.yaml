{
  "apiVersion": "autoscaling/v2",
  "kind": "HorizontalPodAutoscaler",
  "metadata": {
    "name": "frontend",
    "namespace": "scanner"
  },
  "spec": {
    "scaleTargetRef": {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "name": "frontend"
    },
    "minReplicas": 2,
    "maxReplicas": 5,
    "metrics": [
      {
        "type": "Resource",
        "resource": {
          "name": "cpu",
          "target": {
            "type": "Utilization",
            "averageUtilization": 60
          }
        }
      }
    ],
    "behavior": {
      "scaleDown": {
        "stabilizationWindowSeconds": 180
      },
      "scaleUp": {
        "stabilizationWindowSeconds": 0,
        "policies": [
          {
            "type": "Pods",
            "value": 2,
            "periodSeconds": 60
          }
        ]
      }
    }
  }
}
