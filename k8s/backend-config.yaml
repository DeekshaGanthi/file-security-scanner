{
  "apiVersion": "cloud.google.com/v1",
  "kind": "BackendConfig",
  "metadata": {
    "name": "frontend",
    "namespace": "scanner"
  },
  "spec": {
    "timeoutSec": 3600,
    "connectionDraining": {
      "drainingTimeoutSec": 180
    },
    "sessionAffinity": {
      "affinityType": "GENERATED_COOKIE",
      "affinityCookieTtlSec": 3600
    },
    "healthCheck": {
      "type": "HTTP",
      "requestPath": "/_stcore/health",
      "port": 8501,
      "checkIntervalSec": 10,
      "timeoutSec": 5,
      "healthyThreshold": 1,
      "unhealthyThreshold": 3
    }
  }
}
