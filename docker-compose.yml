services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: file-security-scanner:v3

    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set}

      # Cloud SQL PostgreSQL
      DB_HOST: "172.27.208.3"
      DB_PORT: "5432"
      DB_NAME: "scanner_db"
      DB_USER: "scanner_app"
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_SSLMODE: "require"

      # Google Cloud Storage
      GCS_BUCKET_NAME: "file-security-scanner-uploads-2026"

    volumes:
      # Preserve existing data volumes during migration.
      - scanner-data:/app/data
      - uploads-data:/app/uploads

    expose:
      - "8000"

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    image: file-security-scanner:v3

    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    environment:
      API_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      - api

    restart: unless-stopped

volumes:
  scanner-data:
  uploads-data: